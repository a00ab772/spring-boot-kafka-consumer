version: '2'

services:
  # Our Kafka cluster
  kafka-cluster:
    image: landoop/fast-data-dev:cp3.3.0
    environment:
      ADV_HOST: 127.0.0.1         # 192.168.99.100 si usas Docker Toolbox (Windows)
      RUNTESTS: 0                 # No queremos test, arrancará más rápido
    ports:
      - 2181:2181                 # Zookeeper
      - 3030:3030                 # Landoop UI
      - 8082-8084:8081-8083       # REST Proxy, Schema Registry, Kafka Connect ports.
                                  # Muevo un número a la derecha porque tengo artifactory
      - 9581-9585:9581-9585       # JMX Ports
      - 9092:9092                 # Kafka Broker
      - 9093:9093                 # Kafka Broker SSL
      - 9094:9094                 # Kafka Broker SASL

  # elasticsearch -> sink
  elasticsearch:
    image: itzg/elasticsearch:2.4.3
    environment:
      PLUGINS: appbaseio/dejavu
      OPTS: -Dindex.number_of_shards=1 -Dindex.number_of_replicas=0
    ports:
      - "9200:9200"

  # postgres _-> sink
  postgres:
    image: postgres:9.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432

